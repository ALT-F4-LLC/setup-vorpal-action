name: "Set up Vorpal"
description: "Downloads and sets up the Vorpal binary, and starts the service."
inputs:
  version:
    description: "The version of Vorpal to install (e.g., v0.4.0). Defaults to the latest release on GitHub when omitted."
    required: false
  github-token:
    description: "Token used to authenticate 'gh attestation verify' when installing a downloaded Vorpal release binary."
    required: false
    default: "${{ github.token }}"
  use-local-build:
    description: "Use a pre-built binary from the workspace."
    required: false
    default: "false"
  registry-backend:
    description: "Registry backend to use (local, s3)."
    required: false
    default: "local"
  registry-backend-s3-bucket:
    description: "S3 bucket name for s3 backend."
    required: false
  port:
    description: "Port for vorpal services."
    required: false
  services:
    description: "Services to start (comma-separated)."
    required: false
    default: "agent,registry,worker"
outputs:
  version:
    description: "The version of Vorpal that was installed (explicit input or resolved latest release)."
runs:
  using: "node24"
  main: "dist/index.js"
  post: "dist/cleanup.js"
  post-if: "always()"
